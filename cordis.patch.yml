# DSH 0.1.7 declares presets in the Loader tree instead of scanning roots.
# The include keeps !!js expressions deferred and runtime paths relative to
# their composition. Its path is relative to the active profile directory.
- insert:
    - id: preset-reasoning-support
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reasoning-support
        name: Reasoning Support
        description: DSV4.1 reasoning with native tools and bounded artifact acceptance.
        order: 2
        plugins:
          - id: reasoning-support-composition
            name: cordis:include
            config:
              path: ./node_modules/dsh-reasoning-support/presets/reasoning-support/desktop.cordis.yml
